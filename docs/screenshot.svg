<svg xmlns="http://www.w3.org/2000/svg" width="638" height="550" viewBox="0 0 638 550" role="img" aria-label="The Road That Bends Back running in a terminal. The walker has arrived at the scorched milestone for the second time; the game notes that they have stood here twice and that the ring of beaten grass is wider than it was.">
  <title>The Road That Bends Back - the milestone, on the second arrival</title>
  <rect x="0.5" y="0.5" width="637" height="549" rx="8" fill="#14181d" stroke="#2a323c"/>
  <path d="M0.5 8.5a8 8 0 0 1 8-8h621a8 8 0 0 1 8 8v26H0.5z" fill="#1d232b"/>
  <line x1="0.5" y1="34.0" x2="637" y2="34.0" stroke="#2a323c"/>
  <circle cx="21" cy="17.5" r="5" fill="#e0705e"/>
  <circle cx="39" cy="17.5" r="5" fill="#d4a95e"/>
  <circle cx="57" cy="17.5" r="5" fill="#7fbf94"/>
  <text x="319" y="22" fill="#8b97a6" font-size="12" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, 'DejaVu Sans Mono', Consolas, monospace">glyph run</text>
  <text font-family="ui-monospace, SFMono-Regular, Menlo, 'DejaVu Sans Mono', Consolas, monospace" font-size="15" xml:space="preserve"><tspan x="22.0" y="66.0" fill="#74808f" font-weight="400" textLength="594.0" lengthAdjust="spacingAndGlyphs">==================================================================</tspan><tspan x="31.0" y="88.0" fill="#f2f6fa" font-weight="600" textLength="198.0" lengthAdjust="spacingAndGlyphs">THE SCORCHED MILESTONE</tspan><tspan x="499.0" y="88.0" fill="#74808f" font-weight="400" textLength="108.0" lengthAdjust="spacingAndGlyphs">Day 3 - dusk</tspan><tspan x="22.0" y="110.0" fill="#74808f" font-weight="400" textLength="594.0" lengthAdjust="spacingAndGlyphs">------------------------------------------------------------------</tspan><tspan x="31.0" y="132.0" fill="#cdd6e0" font-weight="400" textLength="54.0" lengthAdjust="spacingAndGlyphs">health</tspan><tspan x="94.0" y="132.0" fill="#7fbf94" font-weight="400" textLength="90.0" lengthAdjust="spacingAndGlyphs">##########</tspan><tspan x="193.0" y="132.0" fill="#cdd6e0" font-weight="400" textLength="108.0" lengthAdjust="spacingAndGlyphs">100   energy</tspan><tspan x="310.0" y="132.0" fill="#e0705e" font-weight="400" textLength="90.0" lengthAdjust="spacingAndGlyphs">###.......</tspan><tspan x="418.0" y="132.0" fill="#cdd6e0" font-weight="400" textLength="18.0" lengthAdjust="spacingAndGlyphs">27</tspan><tspan x="31.0" y="154.0" fill="#cdd6e0" font-weight="400" textLength="54.0" lengthAdjust="spacingAndGlyphs">hunger</tspan><tspan x="94.0" y="154.0" fill="#d4a95e" font-weight="400" textLength="90.0" lengthAdjust="spacingAndGlyphs">#####.....</tspan><tspan x="202.0" y="154.0" fill="#cdd6e0" font-weight="400" textLength="18.0" lengthAdjust="spacingAndGlyphs">54</tspan><tspan x="247.0" y="154.0" fill="#74808f" font-weight="400" textLength="144.0" lengthAdjust="spacingAndGlyphs">coin 12   food 4</tspan><tspan x="22.0" y="176.0" fill="#74808f" font-weight="400" textLength="594.0" lengthAdjust="spacingAndGlyphs">==================================================================</tspan><tspan x="40.0" y="220.0" fill="#cdd6e0" font-weight="400" textLength="486.0" lengthAdjust="spacingAndGlyphs">A milestone, scorched black down its western face, the</tspan><tspan x="40.0" y="242.0" fill="#cdd6e0" font-weight="400" textLength="513.0" lengthAdjust="spacingAndGlyphs">distance on it burned away to a smooth nothing. The grass</tspan><tspan x="40.0" y="264.0" fill="#cdd6e0" font-weight="400" textLength="531.0" lengthAdjust="spacingAndGlyphs">around it is beaten flat in a wide ring, as if a great many</tspan><tspan x="40.0" y="286.0" fill="#cdd6e0" font-weight="400" textLength="459.0" lengthAdjust="spacingAndGlyphs">people had stood here a great many times, thinking.</tspan><tspan x="40.0" y="330.0" fill="#74808f" font-weight="400" textLength="270.0" lengthAdjust="spacingAndGlyphs">(You have stood here 2 times.)</tspan><tspan x="40.0" y="374.0" fill="#cdd6e0" font-weight="400" textLength="549.0" lengthAdjust="spacingAndGlyphs">You have read this stone before. You are almost sure of it --</tspan><tspan x="40.0" y="396.0" fill="#cdd6e0" font-weight="400" textLength="540.0" lengthAdjust="spacingAndGlyphs">and the ring of beaten grass around it is wider than it was,</tspan><tspan x="40.0" y="418.0" fill="#cdd6e0" font-weight="400" textLength="459.0" lengthAdjust="spacingAndGlyphs">or else you are standing in a different part of it.</tspan><tspan x="49.0" y="462.0" fill="#f2f6fa" font-weight="600" textLength="270.0" lengthAdjust="spacingAndGlyphs">[A] Follow the cart ruts north</tspan><tspan x="526.0" y="462.0" fill="#74808f" font-weight="400" textLength="72.0" lengthAdjust="spacingAndGlyphs">9 energy</tspan><tspan x="49.0" y="484.0" fill="#f2f6fa" font-weight="600" textLength="297.0" lengthAdjust="spacingAndGlyphs">[B] Cut through the burnt orchard</tspan><tspan x="517.0" y="484.0" fill="#74808f" font-weight="400" textLength="81.0" lengthAdjust="spacingAndGlyphs">16 energy</tspan><tspan x="49.0" y="528.0" fill="#74808f" font-weight="400" textLength="414.0" lengthAdjust="spacingAndGlyphs">[R]est  [H]unt  [E]at  [L]ook  [N]otes  [Q]uit</tspan></text>
</svg>
